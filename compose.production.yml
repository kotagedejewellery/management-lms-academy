name: kgj-lms-academy

services:
  app:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      target: app
    image: ${APP_IMAGE:-kgj-lms-academy-app}:${APP_TAG:-latest}
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      internal:
        aliases:
          - kgj-lms-fpm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      target: web
    image: ${APP_IMAGE:-kgj-lms-academy-app}-web:${APP_TAG:-latest}
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage:ro
    networks:
      - internal
      - proxy
    depends_on:
      app:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.kgj-lms-academy.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.kgj-lms-academy.entrypoints=websecure"
      - "traefik.http.routers.kgj-lms-academy.tls=true"
      - "traefik.http.routers.kgj-lms-academy.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.kgj-lms-academy.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ${APP_IMAGE:-kgj-lms-academy-app}:${APP_TAG:-latest}
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ${APP_IMAGE:-kgj-lms-academy-app}:${APP_TAG:-latest}
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
  internal:
    internal: true

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:-kgj-lms-academy_postgres_data}
  redis_data:
    external: true
    name: ${REDIS_VOLUME:-kgj-lms-academy_redis_data}
  storage_data:
    external: true
    name: ${STORAGE_VOLUME:-kgj-lms-academy_storage_data}
