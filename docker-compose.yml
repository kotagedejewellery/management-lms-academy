name: kgj-lms-academy

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: >-
      sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
      && chown -R www-data:www-data storage
      && exec php-fpm"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-kgj_academy}
      DB_USERNAME: ${POSTGRES_USER:-kgj}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kgj_local_only}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 180
      FILESYSTEM_DISK: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-kgj_academy}
      DB_USERNAME: ${POSTGRES_USER:-kgj}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kgj_local_only}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 180
      FILESYSTEM_DISK: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-kgj_academy}
      DB_USERNAME: ${POSTGRES_USER:-kgj}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kgj_local_only}
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 180
      FILESYSTEM_DISK: local
    depends_on:
      db:
        condition: service_healthy

  node:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: >-
      sh -c "if [ -f package.json ]; then npm ci && npm run dev -- --host 0.0.0.0; else sleep infinity; fi"
    ports:
      - "${VITE_PORT:-5174}:5173"
    environment:
      VITE_PORT: ${VITE_PORT:-5174}
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - node_modules:/var/www/html/node_modules

  db:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kgj_academy}
      POSTGRES_USER: ${POSTGRES_USER:-kgj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgj_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
    # Kept outside Compose lifecycle so `docker compose down -v` cannot erase local data.
    external: true
    name: kgj-lms-academy_postgres_data
  redis_data:
  vendor:
  storage:
  node_modules:
