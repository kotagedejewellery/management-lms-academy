name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: cp .env.example .env && php artisan key:generate
      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend checks
        run: |
          npm run check
          npm run types:check
      - name: Production build
        run: npm run build
      - name: Backend checks and tests
        run: |
          composer lint:check
          composer types:check
          php artisan test

  deploy:
    name: Deploy to VPS
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: kgj-lms-academy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_APP_PATH: ${{ vars.VPS_APP_PATH || '/opt/apps/sistem-lms-academy/management-lms-academy' }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -eu
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Missing VPS_SSH_KNOWN_HOSTS secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy release
        shell: bash
        run: |
          set -eu
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "VPS_APP_PATH='$VPS_APP_PATH' bash -se" <<'REMOTE'
          set -eu
          if [ ! -d "$VPS_APP_PATH/.git" ] || [ ! -f "$VPS_APP_PATH/.env.production" ]; then
            echo "Production belum diinisialisasi; deploy dilewati dengan aman."
            exit 0
          fi
          cd "$VPS_APP_PATH"
          test -f .env.production
          git fetch --prune origin main
          git checkout --force main
          git reset --hard origin/main
          docker network inspect "$(grep '^TRAEFIK_NETWORK=' .env.production | cut -d= -f2 || printf 'proxy')" >/dev/null
          docker volume create "$(grep '^POSTGRES_VOLUME=' .env.production | cut -d= -f2 || printf 'kgj-lms-academy_postgres_data')" >/dev/null
          docker volume create "$(grep '^REDIS_VOLUME=' .env.production | cut -d= -f2 || printf 'kgj-lms-academy_redis_data')" >/dev/null
          docker volume create "$(grep '^STORAGE_VOLUME=' .env.production | cut -d= -f2 || printf 'kgj-lms-academy_storage_data')" >/dev/null
          docker compose --env-file .env.production -f compose.production.yml up -d --build --remove-orphans
          docker compose --env-file .env.production -f compose.production.yml exec -T app php artisan migrate --force
          docker compose --env-file .env.production -f compose.production.yml exec -T app php artisan optimize
          docker compose --env-file .env.production -f compose.production.yml exec -T app php artisan queue:restart
          docker compose --env-file .env.production -f compose.production.yml exec -T web wget -q -O /dev/null http://127.0.0.1/up
          REMOTE
